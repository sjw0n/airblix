
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, "Apple SD Gothic Neo", sans-serif;
      color: #111111;
    }

    .container {
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(120px, 22vw, 220px);
      font-weight: 800;
      letter-spacing: -12px;
      line-height: 1;
      margin-bottom: 40px;
      color: #111111;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 28px;
      border-radius: 8px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .home-button:hover {
      background: #333333;
      transform: translateY(-2px);
    }

    .home-button:focus-visible {
      outline: 2px solid #111111;
      outline-offset: 4px;
    }

    @media (max-width: 480px) {
      h1 {
        letter-spacing: -7px;
        margin-bottom: 32px;
      }

      .home-button {
        min-height: 48px;
        padding: 0 24px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>404</h1>
    <a href="/" class="home-button">홈으로 돌아가기</a>
  </main>
</body>
</html>
